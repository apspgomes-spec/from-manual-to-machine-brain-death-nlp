[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-ct-nlp"
version = "1.0.0"
authors = [{name = "António Gomes"}, {name = "Ana França"}, {name = "Eduardo Sousa"}, {name = "António Gonçalves"}, {name = "Ana Paula Fernandes"}]
description = "Transparent, audit-first preprocessing of Portuguese brain CT PDF reports"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23,<2",
    "pandas>=2.0,<4",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]
analysis = ["openpyxl>=3.1", "scipy>=1.11", "matplotlib>=3.7", "xgboost>=2.0,<4", "shap>=0.45", "wordcloud>=1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
bd-ct-nlp-review = "bd_ct_nlp.review_cli:main"
